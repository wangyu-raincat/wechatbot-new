[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechatbot-new"
version = "3.0.0"
description = "微信自动回复：监听指定联系人或群聊，调用 DeepSeek 等 OpenAI 兼容接口生成回复。仅 Windows，需已登录微信。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
keywords = ["wechat", "weixin", "chatbot", "deepseek"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "wechatauto-replica[guia]>=1.2.4.4",
    "openai==1.84.0",
]

[project.urls]
Homepage = "https://github.com/wangyu-raincat/wechatbot-new"
Source = "https://github.com/wangyu-raincat/wechatbot-new"

[project.scripts]
wechatbot = "bot:main"

[tool.setuptools]
py-modules = ["bot", "config", "run", "wxbot"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["prompts*"]

[tool.setuptools.package-data]
"*" = ["*.md"]

[tool.setuptools.exclude-package-data]
"*" = [
    "config_local.py",
    ".env",
    ".env.*",
    "*.log",
    "*.pid",
    "chat_contexts.json",
]
